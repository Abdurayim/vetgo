<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VetGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Rubik:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="css/styles.css?v=3" />
</head>
<body data-i18n-title="home.title">
  <div id="header"></div>

  <main>
    <section class="hero">
      <div class="hero-content">
        <span class="hero-tag" data-i18n="home.noSignup">No sign-up needed</span>
        <h1 data-i18n-html="home.heroTitleHtml">Find a trusted vet <em>near you</em></h1>
        <p data-i18n="home.heroText">Allow location access and we'll show you the veterinarians closest to you.</p>
        <div class="hero-actions">
          <button class="btn btn-accent btn-lg" id="locateBtn" type="button"><span data-icon="pin"></span><span data-i18n="home.findNearMe">Find vets near me</span></button>
          <a class="btn btn-light btn-lg" href="#vets" data-i18n="home.browseAll">Browse all</a>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true"></div>
    </section>

    <div class="container">
      <div id="notice"></div>

      <section id="vets">
        <div class="section-head">
          <h2 id="listTitle" data-i18n="home.listTitle">Veterinarians</h2>
          <span class="count" id="listCount"></span>
        </div>
        <div id="results" class="grid"></div>
      </section>
    </div>
  </main>

  <div id="footer"></div>

  <!-- ?v= busts browser/GitHub Pages caching so this page never runs stale scripts -->
  <script src="js/config.js?v=3"></script>
  <script src="js/i18n.js?v=3"></script>
  <script src="js/api.js?v=3"></script>
  <script src="js/ui.js?v=3"></script>
  <script src="js/home.js?v=3"></script>
</body>
</html>
