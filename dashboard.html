<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VetGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Rubik:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/styles.css?v=3" />
</head>
<body data-i18n-title="dash.title">
  <div id="header"></div>

  <main class="container page">
    <div class="dash-head">
      <h1 data-i18n="dash.heading">My profile</h1>
      <div class="dash-actions">
        <a class="btn btn-outline" id="viewPublic" href="#" target="_blank" rel="noopener"><span data-icon="external" data-size="18"></span><span data-i18n="dash.viewPublic">View public page</span></a>
        <button class="btn btn-ghost" id="logoutBtn" type="button"><span data-icon="logout" data-size="18"></span><span data-i18n="dash.logout">Log out</span></button>
      </div>
    </div>
    <p class="dash-sub" data-i18n="dash.sub">This is what pet owners see. Keep it up to date.</p>

    <div class="dash-grid">
      <aside class="dash-preview">
        <span class="eyebrow" data-i18n="dash.preview">Preview</span>
        <div id="preview"></div>
      </aside>

      <div class="form-card">
        <div class="form-msg" id="msg"></div>

        <div id="loading" class="loading-state"><span class="spinner spinner-lg"></span></div>

        <form id="profileForm" class="hidden" novalidate>
          <div class="field">
            <label for="full_name" data-i18n="field.fullName">Full name</label>
            <input id="full_name" name="full_name" type="text" required />
          </div>

          <div class="field">
            <label for="profession" data-i18n="field.profession">Profession / specialty</label>
            <input id="profession" name="profession" type="text" required />
          </div>

          <div class="field">
            <label for="description" data-i18n="field.about">About you</label>
            <textarea id="description" name="description"></textarea>
          </div>

          <div class="field">
            <label for="phone" data-i18n="field.phone">Contact phone</label>
            <input id="phone" name="phone" type="tel" required />
          </div>

          <div class="field">
            <label for="photo" data-i18n="field.photo">Profile photo</label>
            <div class="photo-row">
              <img id="currentPhoto" class="photo-preview hidden" alt="" />
              <div class="photo-input">
                <input id="photo" name="photo" type="file" accept="image/*" />
                <span class="hint" data-i18n="dash.replacePhoto">Choose a file to replace your photo.</span>
              </div>
            </div>
          </div>

          <div class="field">
            <label data-i18n="field.locationShort">Location</label>
            <div class="location-row">
              <button type="button" class="btn btn-accent" id="locBtn"><span data-icon="locate"></span><span data-i18n="btn.updateLocation">Update to current location</span></button>
              <button type="button" class="btn btn-outline" id="mapBtn"><span data-icon="map"></span><span data-i18n="btn.chooseOnMap">Choose on map</span></button>
              <span class="location-status" id="locStatus"></span>
            </div>
            <div class="map-wrap hidden" id="mapWrap">
              <div class="map-picker" id="map"></div>
              <span class="hint" data-i18n="loc.mapHint">Tap the map or drag the pin to your clinic's location.</span>
            </div>
            <input type="hidden" id="latitude" name="latitude" />
            <input type="hidden" id="longitude" name="longitude" />
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn" data-i18n="dash.save">Save changes</button>
        </form>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- ?v= busts browser/GitHub Pages caching so this page never runs stale scripts -->
  <script src="js/config.js?v=3"></script>
  <script src="js/i18n.js?v=3"></script>
  <script src="js/api.js?v=3"></script>
  <script src="js/ui.js?v=3"></script>
  <script src="js/location.js?v=3"></script>
  <script src="js/dashboard.js?v=3"></script>
</body>
</html>
