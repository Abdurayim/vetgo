name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment; cancel in-flight runs for the same
# branch so stale deployments never stomp a newer one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Reads the repo's GitHub Pages settings and exposes:
      #   steps.pages.outputs.base_path  → e.g. "/vet"
      #   steps.pages.outputs.base_url   → e.g. "https://abdurayim.github.io/vet"
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Trailing slash required by Vite's base option
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          # Never ship mock auth to production
          VITE_MOCK_AUTH: "false"

      # React Router uses the HTML5 History API. GitHub Pages returns a real
      # 404 for any path it doesn't know about (i.e. every deep link).
      # Copying index.html → 404.html makes GitHub Pages serve our SPA shell
      # for those requests, letting the client-side router take over.
      - name: Create 404.html for client-side routing
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
